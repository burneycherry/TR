<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>変圧器 機器選定</title>
<meta name="description" content="変圧器の容量・電圧から一次/二次電流、LBSヒューズ、CT、THR、銅バー・電線、主幹ブレーカーを選定">
<meta name="theme-color" content="#1f4e79" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tr選定">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>変圧器 機器選定</h1>
  <span class="ver" id="ver"></span>
</header>

<main>
  <section class="card" aria-label="入力">
    <h2>入力</h2>

    <div class="field">
      <span class="label">電源相</span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="phase" value="3" checked><span>三相</span></label>
        <label><input type="radio" name="phase" value="1"><span>単相</span></label>
      </div>
    </div>

    <div class="field">
      <label class="label" for="kva">容量 [kVA]</label>
      <input id="kva" type="number" inputmode="decimal" min="1" step="any" value="300">
      <div class="chips" id="kvaChips"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label class="label" for="v1">一次電圧 [V]</label>
        <select id="v1">
          <option value="6600" selected>6600</option>
          <option value="3300">3300</option>
          <option value="22000">22000</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="v2">二次電圧 [V]</label>
        <select id="v2"></select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label class="label" for="z">%Z（任意）</label>
        <input id="z" type="number" inputmode="decimal" min="0" step="any" placeholder="">
      </div>
      <div class="field">
        <label class="label" for="isc">一次側短絡電流 [kA]（任意）</label>
        <input id="isc" type="number" inputmode="decimal" min="0" step="any" placeholder="空欄=無限大">
      </div>
    </div>
    <p class="hint" id="inputErr" role="alert"></p>
  </section>

  <div id="results"></div>

  <div class="actions">
    <button type="button" id="copyBtn">結果をコピー</button>
    <button type="button" id="resetBtn" class="sub">入力リセット</button>
  </div>

  <section class="card notes">
    <h2>注意事項</h2>
    <ul>
      <li>メーカー別の選定値・遮断容量・許容電流は<strong>参考値</strong>です。「要確認」表示の項目は最新カタログで必ず確認してください。</li>
      <li>短絡電流は %Z のみ（R/X 分離なし）の簡易計算です。電源側は一次側短絡電流を入力した場合のみ考慮します。</li>
      <li>単相3線式の105V側短絡電流は210V側の値と異なります。</li>
      <li>幹線（電線・銅バー）は主幹ブレーカー定格以上で選定しています。電圧降下・布設条件の低減は別途検討してください。</li>
    </ul>
  </section>
</main>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
